<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-label="dsh-ai-group architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 17px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .lbl { font-size: 12px; fill: #475569; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge2 { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="640" rx="18" fill="#ffffff"/>
  <text x="40" y="54" class="title" style="font-size:20px">dsh-ai-group · architecture</text>
  <text x="40" y="78" class="sub">One prompt, three assistants. Everything runs locally; no API keys, no relay server.</text>

  <!-- DSH Web UI -->
  <rect x="40" y="150" width="250" height="128" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="64" y="184" class="title">DSH Web UI</text>
  <text x="64" y="208" class="sub">AI 群 page (iframe)</text>
  <text x="64" y="230" class="small">vanilla HTML/CSS/JS</text>
  <text x="64" y="250" class="small">sidebar entry + main slot</text>

  <!-- DSH Host -->
  <rect x="370" y="108" width="330" height="336" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="394" y="142" class="title">DSH Host (Node)</text>
  <text x="394" y="164" class="small">in-process Cordis plugin</text>

  <rect x="394" y="182" width="282" height="62" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="410" y="207" class="sub">Routes /ai-group/*</text>
  <text x="410" y="228" class="small">page, state, send, login, warm</text>

  <rect x="394" y="256" width="282" height="62" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="410" y="281" class="sub">Chat orchestrator</text>
  <text x="410" y="302" class="small">one turn → three parallel jobs</text>

  <rect x="394" y="330" width="282" height="92" rx="10" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="410" y="355" class="sub">Adapters</text>
  <text x="410" y="377" class="small">Yuanbao · Doubao → CDP</text>
  <text x="410" y="397" class="small">DeepSeek → ctx.llm</text>

  <!-- Browser -->
  <rect x="780" y="108" width="300" height="150" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="804" y="142" class="title">Browser</text>
  <text x="804" y="166" class="sub">Edge or Chrome</text>
  <text x="804" y="188" class="small">CDP :9225–9234 (auto)</text>
  <text x="804" y="208" class="small">dedicated user-data-dir</text>
  <text x="804" y="228" class="small">login persists locally</text>

  <!-- Services -->
  <rect x="780" y="316" width="300" height="92" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="804" y="348" class="title">元宝 Web</text>
  <text x="804" y="372" class="small">yuanbao.tencent.com</text>

  <rect x="780" y="428" width="300" height="92" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="804" y="460" class="title">豆包 Web</text>
  <text x="804" y="484" class="small">www.doubao.com</text>

  <rect x="40" y="428" width="250" height="120" rx="14" fill="#eef2ff" stroke="#6d7cff" stroke-width="1.5"/>
  <text x="64" y="462" class="title">DeepSeek</text>
  <text x="64" y="486" class="sub">DSH current model</text>
  <text x="64" y="508" class="small">via ctx.llm, no extra login</text>

  <!-- Edges -->
  <line x1="292" y1="214" x2="368" y2="214" class="edge2"/>
  <text x="298" y="206" class="lbl">HTTP</text>

  <line x1="702" y1="196" x2="778" y2="196" class="edge2"/>
  <text x="714" y="190" class="lbl">CDP</text>

  <path d="M930 258 L930 314" class="edge"/>
  <text x="944" y="294" class="lbl">HTTPS · session</text>

  <path d="M930 408 L930 426" class="edge"/>

  <path d="M370 470 L292 470" class="edge"/>
  <text x="302" y="462" class="lbl">ctx.llm</text>

  <text x="40" y="604" class="small">The Host never talks to a vendor API for Yuanbao / Doubao — it drives the real web apps through the local browser.</text>
</svg>
